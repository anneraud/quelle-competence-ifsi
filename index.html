<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quelle compétence je mobilise ? — Référentiel infirmier 2026</title>
<style>
  :root{
    --bg:#f4f6f8;
    --surface:#ffffff;
    --ink:#1c2530;
    --ink-soft:#5b6875;
    --line:#e2e7ec;
    --accent:#0f6e63;
    --accent-ink:#ffffff;
    --accent-soft:#e5f3f1;
    --new-bg:#fff4e0;
    --new-ink:#8a5a00;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,30,40,.06), 0 6px 20px rgba(20,30,40,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,#0f6e63 0%, #0c5a51 100%);
    color:#fff;
    padding:18px 16px 20px;
    box-shadow:0 2px 12px rgba(0,0,0,.12);
  }
  header.top .inner{max-width:900px;margin:0 auto;}
  .header-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:14px;
  }
  .header-row .logo{
    flex:0 0 auto;
    height:54px;
    width:auto;
    border-radius:8px;
    background:#fff;
    padding:5px 7px;
  }
  header.top h1{
    margin:0 0 4px;
    font-size:1.28rem;
    font-weight:700;
    letter-spacing:-.01em;
  }
  header.top p{
    margin:0;
    font-size:.86rem;
    color:#d3ece7;
  }

  .search-box{
    position:relative;
    display:flex;
    align-items:center;
    background:#fff;
    border-radius:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .search-box svg{flex:0 0 auto;margin-left:14px;color:#8a97a3;}
  #search{
    flex:1;
    border:0;
    outline:0;
    padding:14px 12px;
    font-size:1.05rem;
    color:var(--ink);
    background:transparent;
    min-width:0;
  }
  #clearBtn{
    display:none;
    border:0;background:transparent;color:#8a97a3;cursor:pointer;
    font-size:1.3rem;line-height:1;padding:8px 14px;
  }
  #clearBtn.show{display:block;}

  .year-filters{
    display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;
  }
  .chip{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    color:#fff;
    padding:6px 12px;
    border-radius:999px;
    font-size:.82rem;
    cursor:pointer;
    user-select:none;
    transition:.15s;
  }
  .chip.active{
    background:#fff;
    color:#0c5a51;
    border-color:#fff;
    font-weight:600;
  }

  main{padding-top:18px;}

  .hint{
    color:var(--ink-soft);
    font-size:.92rem;
    padding:4px 4px 14px;
  }

  .results-count{
    font-size:.8rem;
    color:var(--ink-soft);
    margin:0 4px 10px;
  }

  .card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    display:flex;
    gap:12px;
    align-items:flex-start;
    border:1px solid transparent;
    transition:transform .1s, box-shadow .1s;
  }
  .card:active{transform:scale(.99);}
  .card:hover{border-color:var(--line);}

  .badge{
    flex:0 0 auto;
    min-width:42px;
    text-align:center;
    padding:5px 8px;
    border-radius:8px;
    font-weight:700;
    font-size:.82rem;
    color:#fff;
  }

  .card-body{flex:1;min-width:0;}
  .card-body .act-text{
    font-size:.98rem;
    line-height:1.38;
    color:var(--ink);
  }
  .card-body .act-text mark{
    background:#ffe28a;
    color:inherit;
    padding:0 1px;
    border-radius:3px;
  }
  .card-body .comp-title{
    font-size:.78rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .tag-new{
    display:inline-block;
    background:var(--new-bg);
    color:var(--new-ink);
    font-size:.68rem;
    font-weight:700;
    padding:2px 7px;
    border-radius:6px;
    margin-left:6px;
    vertical-align:middle;
  }
  .tag-year{
    display:inline-block;
    background:#fde4e1;
    color:#9c2b1f;
    font-size:.68rem;
    font-weight:700;
    padding:2px 7px;
    border-radius:6px;
    margin-left:6px;
    vertical-align:middle;
  }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big{font-size:2.2rem;margin-bottom:6px;}

  /* Browse grid */
  .browse-title{
    font-size:.95rem;
    font-weight:700;
    margin:22px 4px 10px;
    color:var(--ink);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:10px;
  }
  .comp-card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 14px;
    cursor:pointer;
    display:flex;
    gap:12px;
    align-items:center;
  }
  .comp-card .badge{min-width:38px;padding:5px 7px;font-size:.78rem;}
  .comp-card .ct{font-size:.88rem;font-weight:600;line-height:1.25;}
  .comp-card .tag-year{margin-left:0;margin-top:5px;}


  /* Detail overlay */
  .overlay{
    position:fixed;inset:0;
    background:rgba(15,22,28,.45);
    z-index:50;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:760px;
    max-height:92vh;
    overflow-y:auto;
    border-radius:18px 18px 0 0;
    padding:22px 20px 40px;
    animation:slideup .18s ease-out;
  }
  @media(min-width:760px){
    .overlay{align-items:center;}
    .sheet{border-radius:18px;max-height:86vh;margin:20px;}
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  .sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
  .sheet-head .badge{font-size:.95rem;min-width:48px;padding:7px 10px;}
  .sheet-head h2{margin:0;font-size:1.15rem;line-height:1.3;}
  .close-x{
    margin-left:auto;border:0;background:var(--bg);color:var(--ink-soft);
    width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:0 0 auto;
  }

  .sheet .desc{font-size:.96rem;line-height:1.5;color:var(--ink);margin-bottom:14px;}
  .sheet .explain{
    background:var(--accent-soft);
    border-radius:10px;
    padding:12px 14px;
    font-size:.9rem;
    line-height:1.5;
    color:#0c453e;
    margin-bottom:16px;
  }
  .sheet .explain b{display:block;margin-bottom:4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:#0f6e63;}

  .year-tabs{display:flex;gap:6px;margin-bottom:8px;}
  .year-tab{
    flex:1;text-align:center;padding:7px 6px;border-radius:8px;
    background:var(--bg);font-size:.78rem;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .year-tab.active{background:var(--accent);color:#fff;}
  .year-desc{
    font-size:.86rem;color:var(--ink);line-height:1.45;
    background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:18px;min-height:20px;
  }

  .sheet h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin:0 0 8px;}
  .act-list{list-style:none;margin:0 0 6px;padding:0;}
  .act-list li{
    font-size:.92rem;line-height:1.42;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .act-list li.heading{
    font-weight:700;color:var(--accent);border-bottom:none;padding-bottom:2px;padding-top:14px;
  }
  .act-list li:first-child{padding-top:0;}
  .notes{
    margin-top:16px;font-size:.8rem;color:var(--ink-soft);
    background:var(--bg);border-radius:10px;padding:10px 12px;
  }
  .notes p{margin:0 0 6px;}
  .notes p:last-child{margin-bottom:0;}

  footer{
    text-align:center;color:var(--ink-soft);font-size:.75rem;padding:24px 16px 6px;
  }
</style>
</head>

is en indication antipyrétique", "isNew": true, "isHeading": false}, {"text": "Prescription d'antiseptiques à large spectre (hors antibiotique), dans les 5 premiers jours d'une brûlure ou plaie traumatique souillée, hors pied diabétique", "isNew": true, "isHeading": false}, {"text": "Prescription d'arceaux de lit ; location de béquilles et cannes ; lève-malade", "isNew": true, "isHeading": false}, {"text": "Prescription d'ECBU avec antibiogramme si nécessaire", "isNew": true, "isHeading": false}, {"text": "Prescription d'orthèses élastiques de contention (renouvellement à l'identique)", "isNew": true, "isHeading": false}, {"text": "Prescription d'un bilan sanguin (cholestérol, triglycérides, glycémie à jeun) pour évaluer les facteurs de risque cardiovasculaire", "isNew": true, "isHeading": false}, {"text": "Prescription de collants, bas, chaussettes ou bandes de contention (renouvellement à l'identique de la force de compression)", "isNew": true, "isHeading": false}, {"text": "Prescription de contraceptifs d'urgence", "isNew": true, "isHeading": false}, {"text": "Prescription de créatininémie, dosage albuminurie/créatininurie et HbA1c pour les patients diabétiques connus (si non prescrits dans les 3 derniers mois)", "isNew": true, "isHeading": false}, {"text": "Prescription de dispositifs de perfusion à domicile (appareils, accessoires pour chambre implantable ou cathéter central, pieds à sérum)", "isNew": true, "isHeading": false}, {"text": "Prescription de dispositifs pour incontinence et appareil urogénital (étuis péniens, poches, sondes vésicales, dispositifs de stomie)", "isNew": true, "isHeading": false}, {"text": "Prescription de glycémie à jeun ou en urgence (déséquilibre du diabète, hypoglycémie)", "isNew": true, "isHeading": false}, {"text": "Prescription de l'ensemble des vaccins du calendrier vaccinal aux personnes de 11 ans et plus (hors vaccins vivants atténués chez les personnes immunodéprimées)", "isNew": true, "isHeading": false}, {"text": "Prescription de matériel de surveillance glycémique (renouvellement à l'identique) : lancettes, bandelettes, autopiqueurs, aiguilles, capteurs et lecteurs de glucose interstitiel", "isNew": true, "isHeading": false}, {"text": "Prescription de matériel pour nutrition entérale (renouvellement)", "isNew": true, "isHeading": false}, {"text": "Prescription de NFS, plaquettes et ionogramme sanguin, dans le cadre d'une pathologie connue ou de symptômes évocateurs", "isNew": true, "isHeading": false}, {"text": "Prescription de Nitrate d'argent à faible dosage en cas d'hyperbourgeonnement", "isNew": true, "isHeading": false}, {"text": "Prescription de pansements et matériel de pansement pour une durée initiale de 7 jours : pansements adhésifs, compresses stériles et non stériles, coton hydrophile, sparadraps, bandes, films semi-perméables, sets pour plaies, hydrocolloïdes, hydrocellulaires, alginates, hydrogels, pansements à l'argent, super-absorbants, produits hémostatiques, champs stériles, dispositifs de rapprochement cutané, et autres catégories assimilées", "isNew": true, "isHeading": false}, {"text": "Prescription de préservatifs", "isNew": true, "isHeading": false}, {"text": "Prescription de solutions stériles et produits antiseptiques ; sérum physiologique", "isNew": true, "isHeading": false}, {"text": "Prescription de sonde naso-gastrique ou naso-entérale pour nutrition à domicile", "isNew": true, "isHeading": false}, {"text": "Prescription de sprays protecteurs cutanés", "isNew": true, "isHeading": false}, {"text": "Prescription de substituts nicotiniques", "isNew": true, "isHeading": false}, {"text": "Prescription de supports de prévention/traitement d'escarre (matelas, sur-matelas, coussins)", "isNew": true, "isHeading": false}, {"text": "Prescription de tests de dépistage des IST (VIH, hépatites B et C, syphilis, chlamydia, gonocoque)", "isNew": true, "isHeading": false}, {"text": "Prescription des vaccins contre la covid-19 aux personnes de 5 ans et plus", "isNew": true, "isHeading": false}, {"text": "Prescription des vaccins contre la grippe saisonnière aux personnes de 11 ans et plus", "isNew": true, "isHeading": false}, {"text": "Prescription du dosage de bêta-HCG pour confirmation et datation de grossesse", "isNew": true, "isHeading": false}, {"text": "Rédaction d'une ordonnance infirmière sous supervision", "isNew": false, "isHeading": false}, {"text": "Réflexion sur la pertinence d'un examen (biologie, imagerie) : quel résultat attendu pour quel impact sur la prise en charge ?", "isNew": false, "isHeading": false}, {"text": "Renouvellement des contraceptifs oraux (moins d'un an, maximum 6 mois non renouvelable)", "isNew": true, "isHeading": false}, {"text": "Renouvellement du dosage de l'INR sous AVK (renouvellement rapproché en cas de déséquilibre constaté)", "isNew": true, "isHeading": false}, {"text": "Repérage les protocoles de soins infirmiers pré-établis où l'infirmier peut ajuster les doses (ex: titration antalgique, gestion de l'insuline).", "isNew": false, "isHeading": false}, {"text": "Sélectionner un dispositif médical (DM) adapté à une plaie ou à un soin spécifique en s'appuyant sur les données probantes", "isNew": false, "isHeading": false}], "notes": ["☝ Ordonnance médicale initiale de moins d'un an : l'infirmier ne peut renouveler qu'une prescription médicale de contraceptif oral datant de moins d'un an.", "Le renouvellement infirmier ne peut excéder 6 mois, et cette durée ne peut pas être reconduite une seconde fois par l'infirmier — au-delà, la patiente doit revoir un médecin ou une sage-femme.", "Certains contraceptifs oraux peuvent être exclus de ce droit de renouvellement s'ils figurent sur une liste fixée par arrêté du ministre chargé de la Santé (après avis de l'ANSM) — dans l'attente de cette liste spécifique, le principe reste large"]}, {"code": "C5", "title": "Promotion de la santé communautaire", "description": "Concevoir et conduire une démarche de promotion de la santé, d'éducation à la santé, en santé communautaire et populationnelle afin de répondre aux besoins de santé publique", "explanation": "L'infirmier est aussi un acteur de santé publique. Cette compétence concerne les actions menées non pas pour un seul patient, mais pour des groupes ou des communautés. Il s'agit de concevoir et conduire des projets qui favorisent la santé d'une population : ateliers de prévention en milieu scolaire, campagnes de dépistage.", "progress": {"1ère année": "Identifier les priorités de santé publique, les étapes et les méthodes de mise en œuvre d'une démarche de promotion de la santé, d'éducation à la santé, en santé communautaire et populationnelle", "2ème année": "Concevoir et conduire une démarche de promotion de la santé, d'éducation à la santé, en santé communautaire et populationnelle afin de répondre aux besoins de santé publique", "3ème année": "Concevoir et conduire une démarche de promotion de la santé, d'éducation à la santé, en santé communautaire et populationnelle afin de répondre aux besoins de santé publique"}, "activities": [{"text": "Action de dépistage collectif (diabète, hypertension, VIH, vaccination, dépistage cancer…) en service ou lors d'événements de santé publique : octobre rose par exemple", "isNew": false, "isHeading": false}, {"text": "Analyser les besoins de santé d'une population à partir de données épidémiologiques locales", "isNew": false, "isHeading": false}, {"text": "Animer des séances d'information ou de sensibilisation sur des thèmes de santé publique (ex : tabac, addictions, nutrition, sommeil).", "isNew": false, "isHeading": false}, {"text": "Concevoir des supports pédagogiques adaptés (fiches conseils, outils visuels …) pour aider les patients à mieux comprendre leur pathologie et leur traitement ou les facteurs associés", "isNew": false, "isHeading": false}, {"text": "Concevoir et animer une séance d’éducation thérapeutique à la santé pour un groupe de patients d’un même service : sevrage tabagique post infarctus, alimentation patient diabétique, prévention des chutes des personnes âgées", "isNew": false, "isHeading": false}, {"text": "Concevoir une séance d'information ou de prévention pour un groupe de patients ou de résidents (tabac, alcool, alimentation, sédentarité…)", "isNew": false, "isHeading": false}, {"text": "Evaluer l’action de dépistage menée (recueil ressenti participants, mesure d’un indicateur simple)", "isNew": false, "isHeading": false}, {"text": "Mener des séances d'information et de prévention", "isNew": false, "isHeading": false}, {"text": "Participer à des programmes d’aide aux aidants", "isNew": false, "isHeading": false}, {"text": "Participer à la prévention des maladies chroniques et de leurs complications via le sevrage tabagique", "isNew": true, "isHeading": false}, {"text": "Participer à une vaccination comme levier de prévention en période de crise sanitaire", "isNew": true, "isHeading": false}, {"text": "Réaliser un dépistage des IST", "isNew": true, "isHeading": false}, {"text": "Réaliser une intervention de prévention en milieu scolaire, en EHPAD ou lors d'une consultation infirmière de groupe", "isNew": false, "isHeading": false}], "notes": []}, {"code": "C6", "title": "Éducation thérapeutique et consultation infirmière", "description": "Concevoir, conduire et co-construire une démarche d'éducation thérapeutique, de prévention, de dépistage et de repérage auprès d'une personne notamment dans le cadre d'une consultation infirmière", "explanation": "Cette compétence est centrée sur la personne. L'infirmier accompagne un patient atteint d'une maladie chronique pour qu'il devienne acteur de sa propre santé. L'éducation thérapeutique du patient (ETP) consiste à lui apprendre à vivre avec sa maladie, à gérer son traitement, à reconnaître les signes d'alerte. C'est une approche bienveillante, basée sur l'écoute et la co-construction, pas sur la simple transmission d'informations.", "progress": {"1ère année": "Identifier les étapes et l'organisation d'une démarche d'éducation thérapeutique, de prévention, de dépistage et de repérage auprès d'une personne notamment dans le cadre d'une consultation infirmière", "2ème année": "Concevoir et conduire une démarche d'éducation thérapeutique, de prévention, de dépistage et de repérage en intégrant les politiques de santé et les priorités de santé publique", "3ème année": "Concevoir et conduire une démarche d'éducation thérapeutique, de prévention, de dépistage et de repérage en intégrant les politiques de santé et les priorités de santé publique"}, "activities": [{"text": "Education thérapeutique :", "isNew": false, "isHeading": true}, {"text": "Apprentissage et soutien motivationnel pour l'adhésion aux soins, l'observance, l'auto-soin et le bon usage des dispositifs médicaux", "isNew": false, "isHeading": false}, {"text": "Ateliers individuels ou de groupe à visée socio-éducative et socio-thérapeutique", "isNew": false, "isHeading": false}, {"text": "Entretien motivationnel et d'accompagnement, notamment en santé sexuelle et sevrage tabagique", "isNew": true, "isHeading": false}, {"text": "Évaluation de l'état nutritionnel et de l'hydratation, éducation et accompagnement selon les besoins nutritionnels", "isNew": false, "isHeading": false}, {"text": "Initiation et mise en œuvre de la démarche d'éducation thérapeutique (diagnostic éducatif, programme personnalisé, séances, évaluation), y compris en santé mentale et psychiatrie", "isNew": true, "isHeading": false}, {"text": "L'infirmier est habilité à conduire, en autonomie, des consultations infirmières dans les domaines d'activité et de compétence définis par le code de la santé publique", "isNew": true, "isHeading": false}, {"text": "Mener un bilan éducatif initial : identifier les représentations du patient sur sa maladie, ses freins, ses ressources et son projet de vie.", "isNew": false, "isHeading": false}, {"text": "Repérage (signes ou facteurs de risque au cours d’un soin) :", "isNew": false, "isHeading": true}, {"text": "Orienter le patient vers les ressources adaptées (réseaux de soins, associations, structures spécialisées).", "isNew": false, "isHeading": false}, {"text": "Prévention, dépistage, orientation et conseils relatifs aux IST, information sur la PrEP et la Doxy-PEP", "isNew": true, "isHeading": false}, {"text": "Repérage, évaluation, accompagnement et orientation en matière d'addictions", "isNew": true, "isHeading": false}, {"text": "Repérer des signes de mal-être ou risque suicidaire au cours d'un entretien avec appui d'un professionnel référent ou formé, sans agir seul", "isNew": false, "isHeading": false}, {"text": "Démarche transversale :", "isNew": false, "isHeading": true}, {"text": "Évaluer l'intervention menée (atteinte des objectifs, ressenti de la personne, ajustements à prévoir)", "isNew": false, "isHeading": false}, {"text": "Préparer et mener des entretiens de suivi en tenant compte du projet de vie et des priorités exprimées par la personne (ex : suivi de pathologie chronique, éducation à la sortie, observance thérapeutique).", "isNew": false, "isHeading": false}], "notes": []}, {"code": "C7", "title": "Actions environnementales et écoresponsables", "description": "Concevoir et conduire une démarche et des actions de communication et d'éducation des communautés et des organisations sur les enjeux environnementaux, les pratiques et gestes durables et écoresponsables", "explanation": "Compétence nouvelle dans le référentiel 2026, en phase avec les enjeux actuels. L'infirmier doit désormais intégrer la dimension environnementale dans sa pratique : réduire les déchets, limiter les produits polluants, adopter des gestes éco-responsables dans les soins. Il devient aussi un acteur de sensibilisation auprès des patients et des équipes sur les liens entre environnement et santé.", "progress": {"1ère année": "Analyser des données issues des recommandations et des productions en lien avec la gestion des risques environnementaux et les enjeux environnementaux, les pratiques et les gestes durables et écoresponsables", "2ème année": "Conduire une démarche et des actions de communication et d'éducation des communautés et des organisations sur les enjeux environnementaux, les pratiques et gestes durables et écoresponsables", "3ème année": "Concevoir et conduire une démarche et des actions de communication et d'éducation des communautés et des organisations sur les enjeux environnementaux, les pratiques et gestes durables et écoresponsables"}, "activities": [{"text": "Geste individuel dans le soin :", "isNew": false, "isHeading": true}, {"text": "Identifier et appliquer les bonnes pratiques d'éco-soins dans le service (tri des déchets, gestion des DASRI, lutte contre le gaspillage de matériel)", "isNew": false, "isHeading": false}, {"text": "Proposer des alternatives éco-responsables argumentées dans les soins quand elles existent (réduction du plastique par ex.)", "isNew": false, "isHeading": false}, {"text": "Réaliser une analyse critique d’une situation de soins sous l’angle du développement durable en identifiant les tensions éventuelles avec la sécurité ou l’hygiène des soins", "isNew": false, "isHeading": false}, {"text": "Sensibilisation d’un patient, d’un entourage ou d’un groupe :", "isNew": false, "isHeading": true}, {"text": "Concevoir un support de sensibilisation environnementale adapté à un public donné (fiche conseil, affichage, temps d’échange en groupe)", "isNew": false, "isHeading": false}, {"text": "Évaluer si l’action de mobilisation menée a été comprise ou a fait évoluer une pratique", "isNew": false, "isHeading": false}, {"text": "Sensibiliser les patients aux liens entre environnement et santé (pollution, perturbateurs endocriniens, alimentation, qualité de l’air intérieur…)", "isNew": false, "isHeading": false}, {"text": "Contribution à une démarche organisationnelle :", "isNew": false, "isHeading": true}, {"text": "Contribuer à sensibiliser l’équipe à un geste ou une pratique écoresponsable observée en stage", "isNew": false, "isHeading": false}, {"text": "Participer à un groupe de travail, une charte ou une démarche de développement durable au sein d’une structure de soins (comité RSE, référent éco-soins…)", "isNew": false, "isHeading": false}, {"text": "Repérer et faire remonter à l’équipe ou au cadre une piste d’amélioration environnementale identifiée dans l’organisation du service", "isNew": false, "isHeading": false}], "notes": []}, {"code": "C8", "title": "Gérer une structure d'exercice", "description": "Gérer ou organiser une structure d'exercice individuel ou collectif en optimisant les ressources", "explanation": "L'infirmier est aussi gestionnaire de son espace de travail. Cette compétence concerne la capacité à organiser une structure de soins (cabinet libéral, service, unité) : gérer le matériel, les stocks, les ressources humaines au quotidien, optimiser les flux de patients.", "progress": {"1ère année": "Non abordée en 1ère année", "2ème année": "Identifier les aspects réglementaires relatifs à la création et au fonctionnement d'une structure ou d'un cabinet et assurer le suivi des stocks, la gestion des déchets et l'archivage des données", "3ème année": "Proposer la gestion et l'organisation d'une structure d'exercice individuel ou collectif en optimisant les ressources dans une démarche écoresponsable"}, "activities": [{"text": "Coordination des intervenants : Orienter les aides-soignants, kinésithérapeutes ou diététiciens pour optimiser les allées et venues dans les chambres", "isNew": false, "isHeading": false}, {"text": "En libéral : gérer le cabinet (facturation, stocks, partenariats, agenda)", "isNew": false, "isHeading": false}, {"text": "Gestion des flux de patients : Anticiper les sorties (préparer les documents de sortie, contacter les services de suite ou l'HAD) pour fluidifier le parcours patient et libérer les lits.", "isNew": false, "isHeading": false}, {"text": "Maintenance du matériel biomédical : Vérifier le bon fonctionnement des dispositif  d'une situation clinique, réflexion éthique, étude de cas", "isNew": false, "isHeading": false}, {"text": "Rédiger une analyse de pratique professionnelle (APP) selon les modalités de l'IFSI", "isNew": false, "isHeading": false}], "notes": []}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);

// ---------- helpers ----------
function normalize(str){
  return (str||'')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[’']/g,"'")
    .trim();
}

// flatten all activities with ref to competency
const ACTIVITIES = [];
const ACTIVITIES_BY_COMP = DATA.map(() => []);
DATA.forEach((comp, ci) => {
  comp.activities.forEach((a, ai) => {
    if(a.isHeading) return;
    const item = {
      compIndex: ci,
      code: comp.code,
      title: comp.title,
      text: a.text,
      norm: normalize(a.text),
      isNew: a.isNew
    };
    ACTIVITIES.push(item);
    ACTIVITIES_BY_COMP[ci].push(item);
  });
});

// color palette per competency (13 evenly spaced hues, tuned for readability on white text)
function colorFor(code){
  const n = parseInt(code.replace('C',''),10);
  const hue = Math.round(((n-1) * 137.508) % 360); // golden angle distribution
  return `hsl(${hue} 52% 36%)`;
}

// French stopwords ignored when tokenizing the query, so connector words
// ("de", "d'un", "la"...) don't dilute the match.
const STOPWORDS = new Set(['a','au','aux','avec','ce','ces','cet','cette','d','dans','de','des','du',
  'elle','elles','en','et','eu','il','ils','ils','l','la','le','les','leur','leurs','lui','ma','mais',
  'me','mes','mon','ne','nos','notre','nous','on','ou','par','pas','pour','qu','que','qui','sa','se',
  'ses','son','sur','ta','te','tes','toi','ton','tu','un','une','vos','votre','vous']);

function tokenize(normStr){
  return normStr.split(/[^a-z0-9]+/).filter(Boolean);
}

// Crude French "stem": comparing the first 7 letters lets word forms that
// share a root (prescription / prescrire / prescrit, éducatif / éducation)
// count as the same idea, without a full lemmatiser. 7 letters is
// deliberate — verified against the full activity dataset to be the
// shortest prefix length that stops unrelated words from colliding:
// "transfusion" vs "transmission"/"transcutané" (diverge at letter 6),
// and "compression"/"compresses" vs "compréhension"/"comprendre"
// (diverge at letter 7) both need 7 to stay distinct, while true
// word-family variants (patient/patients, prescription/prescrire,
// éducatif/éducation…) still share their first 7 letters.
function stemOf(w){
  return w.length >= 7 ? w.slice(0, 7) : w;
}

// For each compétence, its own title/description, normalised — used to check
// whether the query itself is literally what that compétence is about
// (e.g. typing "éducation thérapeutique" should hit the compétence actually
// named that, even if none of its individual example activities happens to
// repeat that exact phrase word-for-word).
const COMP_TITLE_NORM = DATA.map(comp => normalize(comp.title));
const COMP_DESC_NORM = DATA.map(comp => normalize(comp.title + ' ' + comp.description));
const COMP_TITLE_STEMS = DATA.map(comp => {
  const words = tokenize(COMP_TITLE_NORM[DATA.indexOf(comp)] || normalize(comp.title));
  return new Set(words.filter(w => w.length > 1 && !STOPWORDS.has(w)).map(stemOf));
});
const COMP_DESC_STEMS = DATA.map((comp, ci) => {
  const words = tokenize(COMP_DESC_NORM[ci]);
  const filtered = words.filter(w => w.length > 1 && !STOPWORDS.has(w));
  return new Set(filtered.map(stemOf));
});

// How well does the query match the compétence itself (its name/description),
// independently of any specific example activity. A hit here — especially one
// that covers the compétence's own NAME — is the strongest possible signal
// of which compétence is actually meant, stronger than any coincidental word
// shared with one unrelated example activity.
function competencyOwnMatch(compIndex, queryNorm, queryStems){
  let bonus = 0;
  if(queryNorm.length > 2 && COMP_TITLE_NORM[compIndex].includes(queryNorm)){
    bonus += 1600; // the query literally names this compétence
  } else if(queryNorm.length > 2 && COMP_DESC_NORM[compIndex].includes(queryNorm)){
    bonus += 700;
  }

  const titleStems = COMP_TITLE_STEMS[compIndex];
  const descStems = COMP_DESC_STEMS[compIndex];
  let allInTitle = queryStems.length > 0;
  for(const s of queryStems){
    if(titleStems.has(s)) bonus += 160;
    else { allInTitle = false; if(descStems.has(s)) bonus += 50; }
  }
  // every single query word is part of this compétence's own name: even if
  // not contiguous ("organiser" ... "soins" in "Organiser les activités de
  // soins"), that's a very strong match on the compétence's identity.
  if(allInTitle && queryStems.length > 1) bonus += 500;

  return bonus;
}

// ---------- search scoring ----------
// Goal: surface the SINGLE most relevant activity/compétence, not every
// activity that happens to share one common word.
function scoreActivity(queryNorm, contentWords, item){
  if(contentWords.length === 0) return 0;
  const text = item.norm;
  let score = 0;

  // strong bonus for the query appearing as a literal phrase
  if(queryNorm.length > 2 && text.includes(queryNorm)) score += 1000;

  let matched = 0;
  for(const w of contentWords){
    const wStem = stemOf(w);
    // exact word present, OR any word in the text shares its stem (root)
    let hit = text.includes(w);
    if(!hit && w.length >= 7){
      hit = tokenize(text).some(tw => tw.length >= 7 && stemOf(tw) === wStem);
    }
    if(hit){
      matched++;
      const re = new RegExp('\\b' + escapeRegExp(w));
      score += re.test(text) ? 9 : 4; // word-boundary match scores higher
    }
  }
  if(matched === 0) return 0;

  const coverage = matched / contentWords.length;
  score += coverage * 300;                       // reward matching ALL query words
  score -= (contentWords.length - matched) * 60;  // penalise missing words heavily

  // prefer the more specific (shorter / more targeted) activity on ties
  score -= text.length * 0.04;

  return score;
}

function highlight(text, queryWords){
  if(!queryWords.length) return escapeHtml(text);
  let html = escapeHtml(text);
  // sort words by length desc to avoid partial overlap issues
  const words = [...new Set(queryWords.filter(w=>w.length>1))].sort((a,b)=>b.length-a.length);
  words.forEach(w=>{
    const re = new RegExp('(' + escapeRegExp(w) + ')', 'ig');
    // need accent-insensitive highlight on original text; approximate using normalized compare per word boundary is complex,
    // fallback: simple case-insensitive plain match on original text (works for most non-accented query words)
    html = html.replace(re, '<mark>$1</mark>');
  });
  return html;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// ---------- state ----------
let currentQuery = '';

const mainEl = document.getElementById('main');
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');

// Seules C4 et C8 indiquent explicitement, dans leur progression par année,
// « Non abordée en 1ère année » — et leur 2ème année reste cantonnée à
// « identifier » les principes/le cadre réglementaire, sans mise en pratique.
// Ce sont donc les deux seules compétences non mobilisées en 1ère année,
// dont les activités de stage ne sont pas menées avant la 3ème année.
const NOT_BEFORE_3RD_YEAR_CODES = ['C4', 'C8'];

function render(){
  const q = currentQuery.trim();
  if(!q){
    renderBrowse();
    return;
  }
  const qNorm = normalize(q);
  const allWords = tokenize(qNorm);
  const contentWords = allWords.filter(w => w.length > 1 && !STOPWORDS.has(w));
  const effectiveWords = contentWords.length ? contentWords : allWords;
  const queryStems = effectiveWords.map(stemOf);

  // Score EVERY individual activity, so a term appearing in several
  // activities (e.g. "sonde") surfaces ALL of them, not just one per
  // compétence. The compétence's own name/description relevance
  // (competencyOwnMatch) is added as a per-activity bonus so a query
  // matching a compétence's title (e.g. "éducation thérapeutique" → C6)
  // still ranks at the top even if no single activity repeats the phrase.
  const ownScoreByComp = DATA.map((comp, ci) => competencyOwnMatch(ci, qNorm, queryStems));

  let results = ACTIVITIES.map(item => {
    const actScore = scoreActivity(qNorm, effectiveWords, item);
    if(actScore <= 0) return null;
    const score = actScore + ownScoreByComp[item.compIndex];
    return {compIndex: item.compIndex, score, item};
  }).filter(Boolean);

  // If no individual activity matched but a compétence's own name/
  // description strongly matches the query, still surface that compétence
  // (fallback, showing its description).
  if(results.length === 0){
    DATA.forEach((comp, ci) => {
      if(ownScoreByComp[ci] > 0){
        results.push({compIndex: ci, score: ownScoreByComp[ci], item: null});
      }
    });
  }

  results.sort((a,b) => b.score - a.score);

  if(results.length === 0){
    mainEl.innerHTML = `
      <div class="empty-state">
        <div class="big">🔎</div>
        <div>Aucune activité ne correspond à « ${escapeHtml(q)} ».</div>
        <div style="margin-top:6px;font-size:.82rem;">Essayez un mot plus général (ex : "pansement", "transmission", "prévention"…)</div>
      </div>`;
    return;
  }

  let html = `<div class="results-count">${results.length > 1 ? results.length + ' activités trouvées' : '1 activité trouvée'}</div>`;
  results.forEach(r => {
    const comp = DATA[r.compIndex];
    const item = r.item;
    const notBefore3rd = NOT_BEFORE_3RD_YEAR_CODES.includes(comp.code);
    const bodyText = item
      ? `${highlight(item.text, effectiveWords)}${item.isNew ? '<span class="tag-new">Nouveau 2026</span>' : ''}${notBefore3rd ? '<span class="tag-year">Pas avant la 3ème année</span>' : ''}`
      : escapeHtml(comp.description);
    html += `
      <div class="card" data-comp="${r.compIndex}">
        <div class="badge" style="background:${colorFor(comp.code)}">${comp.code}</div>
        <div class="card-body">
          <div class="act-text">${bodyText}</div>
          <div class="comp-title">${comp.code} · ${escapeHtml(comp.title)}</div>
        </div>
      </div>`;
  });
  mainEl.innerHTML = html;
  attachCardHandlers();
}

function renderBrowse(){
  let html = `<div class="hint">Pas d'idée précise&nbsp;? Parcourez les 13 compétences du référentiel ci-dessous, ou tapez une activité dans la barre de recherche.</div>`;
  html += `<div class="browse-title">Les 13 compétences</div><div class="grid">`;
  DATA.forEach((comp, ci) => {
    const notBefore3rd = NOT_BEFORE_3RD_YEAR_CODES.includes(comp.code);
    html += `
      <div class="comp-card" data-comp="${ci}">
        <div class="badge" style="background:${colorFor(comp.code)}">${comp.code}</div>
        <div>
          <div class="ct">${escapeHtml(comp.title)}</div>
          ${notBefore3rd ? '<span class="tag-year">Non mobilisée en 1ère année</span>' : ''}
        </div>
      </div>`;
  });
  html += `</div>`;
  mainEl.innerHTML = html;
  attachCardHandlers();
}

function attachCardHandlers(){
  document.querySelectorAll('[data-comp]').forEach(el=>{
    el.addEventListener('click', () => openDetail(parseInt(el.getAttribute('data-comp'),10)));
  });
}

// ---------- detail sheet ----------
const overlay = document.getElementById('overlay');
const sheetEl = document.getElementById('sheet');

function openDetail(ci){
  const comp = DATA[ci];
  const notBefore3rd = NOT_BEFORE_3RD_YEAR_CODES.includes(comp.code);

  let actHtml = '';
  comp.activities.forEach(a => {
    if(a.isHeading){
      actHtml += `<li class="heading">${escapeHtml(a.text)}</li>`;
    } else {
      actHtml += `<li>${escapeHtml(a.text)}${a.isNew ? '<span class="tag-new">Nouveau 2026</span>' : ''}${notBefore3rd ? '<span class="tag-year">Pas avant la 3ème année</span>' : ''}</li>`;
    }
  });

  let notesHtml = '';
  if(comp.notes && comp.notes.length){
    notesHtml = `<div class="notes">${comp.notes.map(n=>`<p>${escapeHtml(n)}</p>`).join('')}</div>`;
  }

  sheetEl.innerHTML = `
    <div class="sheet-head">
      <div class="badge" style="background:${colorFor(comp.code)}">${comp.code}</div>
      <h2>${escapeHtml(comp.title)}${notBefore3rd ? '<span class="tag-year">Pas avant la 3ème année</span>' : ''}</h2>
      <button class="close-x" id="closeSheet" aria-label="Fermer">✕</button>
    </div>
    <div class="desc">${escapeHtml(comp.description)}</div>
    ${comp.explanation ? `<div class="explain"><b>Ce que ça veut dire</b>${escapeHtml(comp.explanation)}</div>` : ''}
    <h3>Exemples d'activités de stage</h3>
    <ul class="act-list">${actHtml}</ul>
    ${notesHtml}
  `;

  document.getElementById('closeSheet').addEventListener('click', closeDetail);

  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetail(){
  overlay.classList.remove('show');
  document.body.style.overflow = '';
}
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeDetail(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeDetail(); });

// ---------- events ----------
searchEl.addEventListener('input', ()=>{
  currentQuery = searchEl.value;
  clearBtn.classList.toggle('show', currentQuery.length > 0);
  render();
});
clearBtn.addEventListener('click', ()=>{
  searchEl.value = '';
  currentQuery = '';
  clearBtn.classList.remove('show');
  searchEl.focus();
  render();
});

render();
</script>
</body>
</html>
